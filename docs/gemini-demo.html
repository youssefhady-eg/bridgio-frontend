<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRIDGIO — المنصة التعليمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS — Thmanyah-ready + Warm Charcoal Dark / Warm Cream Light
       ========================================================================= */
    /* Drop self-hosted Thmanyah .woff2 files in /fonts/ to activate automatically */
    @font-face {
      font-family: 'Thmanyah Sans';
      src: local('Thmanyah Sans'), url('/fonts/ThmanyahSans-Regular.woff2') format('woff2');
      font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: 'Thmanyah Sans';
      src: local('Thmanyah Sans Medium'), url('/fonts/ThmanyahSans-Medium.woff2') format('woff2');
      font-weight: 500; font-display: swap;
    }
    @font-face {
      font-family: 'Thmanyah Sans';
      src: local('Thmanyah Sans SemiBold'), url('/fonts/ThmanyahSans-SemiBold.woff2') format('woff2');
      font-weight: 600; font-display: swap;
    }
    @font-face {
      font-family: 'Thmanyah Serif Display';
      src: local('Thmanyah Serif Display Bold'), url('/fonts/ThmanyahSerifDisplay-Bold.woff2') format('woff2');
      font-weight: 700; font-display: swap;
    }

    :root {
      --font-en-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-en-display: 'Sora', 'Inter', sans-serif;
      --font-ar-sans: 'Thmanyah Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif;
      --font-ar-display: 'Thmanyah Serif Display', 'Thmanyah Sans', 'IBM Plex Sans Arabic', serif;

      --font-body: var(--font-ar-sans);
      --font-display: var(--font-ar-display);

      --text-xs: clamp(0.75rem, 0.72rem + 0.1vw, 0.8125rem);
      --text-sm: clamp(0.8125rem, 0.79rem + 0.12vw, 0.875rem);
      --text-base: clamp(0.875rem, 0.85rem + 0.14vw, 0.9375rem);
      --text-lg: clamp(1rem, 0.96rem + 0.22vw, 1.125rem);
      --text-xl: clamp(1.25rem, 1.12rem + 0.45vw, 1.5rem);
      --text-kpi: clamp(1.5rem, 1.38rem + 0.5vw, 1.85rem);

      --topbar-h: 52px;
      --sidebar-w: 236px;
      --sidebar-w-collapsed: 58px;
      --row-h: 42px;
      --content-max: 1320px;

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-full: 9999px;
      --ease: 130ms cubic-bezier(0.2, 0, 0, 1);

      /* Warm Cream Light Mode */
      --bg-canvas: #F6F3EE;
      --bg-surface: #FFFFFF;
      --bg-elevated: #EFEAE2;
      --bg-hover: #F3EFE8;
      --bg-active: #EAE3D8;
      --bg-inset: #FAF8F5;

      --border-subtle: #E5DFD6;
      --border-strong: #CEC5B8;

      --text-primary: #1A1516;
      --text-secondary: #574D4F;
      --text-muted: #7F7375;

      --brand-maroon: #7A1C2E;
      --brand-maroon-hover: #621524;
      --brand-maroon-soft: rgba(122, 28, 46, 0.09);
      --brand-on-primary: #FAF6F1;
      --focus-ring: #94263B;

      --status-success: #1D7A4C;
      --status-success-soft: rgba(29, 122, 76, 0.11);
      --status-warning: #B4690E;
      --status-warning-soft: rgba(180, 105, 14, 0.12);
      --status-danger: #B82E3A;
      --status-danger-soft: rgba(184, 46, 58, 0.11);
      --status-neutral: #7A7072;

      --shadow-xs: 0 1px 2px rgba(26, 21, 22, 0.05);
      --shadow-overlay: 0 16px 40px rgba(20, 14, 15, 0.16);
    }

    :root[dir='ltr'] {
      --font-body: var(--font-en-sans);
      --font-display: var(--font-en-display);
    }

    /* Warm Near-Black Charcoal Dark Mode */
    /* Calibrated Dark Wine Maroon */
    :root[data-theme='dark'] {
      --bg-canvas: #1A0A0E;
      --bg-inset: #14070A;
      --bg-surface: #240F15;
      --bg-elevated: #2F151D;
      --bg-hover: #361821;
      --bg-active: #421D28;

      --border-subtle: #3D1D26;
      --border-strong: #572A37;

      --text-primary: #F7F1EB;
      --text-secondary: #CDB9BF;
      --text-muted: #997F87;

      /* Crimson-wine CTA (5.7:1 contrast with cream text) */
      --brand-maroon: #B32E47;
      --brand-maroon-hover: #C93853;
      --brand-maroon-soft: rgba(179, 46, 71, 0.22);
      --brand-on-primary: #FAF6F1;
      --focus-ring: #E06B80;

      --status-success: #42C27D;
      --status-success-soft: rgba(66, 194, 125, 0.15);
      --status-warning: #E8A63C;
      --status-warning-soft: rgba(232, 166, 60, 0.16);
      --status-danger: #F06570;
      --status-danger-soft: rgba(240, 101, 112, 0.16);
      --status-neutral: #997F87;

      --shadow-xs: 0 1px 2px rgba(8, 2, 4, 0.35);
      --shadow-overlay: 0 20px 48px rgba(8, 2, 4, 0.65);
    }

    /* =========================================================================
       2. RESET, ACCESSIBILITY & SINGLE-SCROLL SHELL
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0; overflow: hidden;
      background: var(--bg-canvas); color: var(--text-primary);
      font-family: var(--font-body); font-size: var(--text-base);
      line-height: 1.55; -webkit-font-smoothing: antialiased;
    }
    :root[dir='ltr'] body { line-height: 1.45; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; color: inherit; }

    .br-num { font-variant-numeric: tabular-nums; }
    .br-bidi-math {
      direction: ltr; unicode-bidi: isolate;
      display: inline-block; font-family: var(--font-en-sans);
      font-variant-numeric: tabular-nums; vertical-align: baseline;
    }
    .katex { font-size: 1.02em; }

    .br-skip-link {
      position: fixed; inset-block-start: -100px; inset-inline-start: 16px;
      z-index: 2000; padding: 8px 14px; border-radius: var(--radius-md);
      background: var(--brand-maroon); color: var(--brand-on-primary);
      font-size: var(--text-sm); font-weight: 600;
    }
    .br-skip-link:focus-visible {
      inset-block-start: 10px; outline: 2px solid var(--focus-ring); outline-offset: 2px;
    }

    .br-shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      grid-template-rows: var(--topbar-h) minmax(0, 1fr);
      height: 100dvh; overflow: hidden;
    }
    .br-shell[data-collapsed='true'] {
      grid-template-columns: var(--sidebar-w-collapsed) minmax(0, 1fr);
    }
    .br-shell[data-focus-mode='true'] {
      grid-template-columns: minmax(0, 1fr);
    }
    .br-shell[data-focus-mode='true'] .br-sidebar { display: none; }

    /* Sidebar */
    .br-sidebar {
      grid-row: 1 / -1; grid-column: 1;
      display: flex; flex-direction: column; min-height: 0;
      background: var(--bg-surface);
      border-inline-end: 1px solid var(--border-subtle);
      z-index: 20;
    }
    .br-sidebar-brand {
      height: var(--topbar-h); display: flex; align-items: center;
      justify-content: space-between; padding-inline: 14px;
      border-block-end: 1px solid var(--border-subtle); flex-shrink: 0;
    }
    .br-wordmark {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-en-display); font-weight: 700; font-size: 1rem;
      letter-spacing: 0.04em; color: var(--text-primary);
    }
    .br-wordmark-mark {
      width: 22px; height: 22px; border-radius: 5px;
      background: var(--brand-maroon); color: var(--brand-on-primary);
      display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; flex-shrink: 0;
    }
    .br-shell[data-collapsed='true'] .br-sidebar-text,
    .br-shell[data-collapsed='true'] .br-nav-group-label,
    .br-shell[data-collapsed='true'] .br-user-meta { display: none; }
    .br-shell[data-collapsed='true'] .br-sidebar-brand { justify-content: center; padding-inline: 0; }
    .br-shell[data-collapsed='true'] .br-wordmark { display: none; }

    .br-sidebar-nav {
      flex: 1; overflow-y: auto; padding: 10px 8px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .br-nav-group-label {
      padding: 0 10px 4px; font-size: 0.72rem; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase;
    }
    .br-nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .br-nav-item {
      position: relative; width: 100%; display: flex; align-items: center; gap: 10px;
      height: 36px; padding-inline: 10px; border-radius: var(--radius-md);
      border: 0; background: transparent; color: var(--text-secondary);
      font-size: var(--text-sm); font-weight: 500; cursor: pointer; text-align: start;
      transition: background var(--ease), color var(--ease);
    }
    .br-nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .br-nav-item[aria-current='page'] {
      background: var(--brand-maroon-soft); color: var(--text-primary); font-weight: 600;
    }
    .br-nav-item[aria-current='page']::before {
      content: ''; position: absolute; inset-inline-start: 0; top: 6px; bottom: 6px;
      width: 2.5px; border-radius: 2px; background: var(--brand-maroon);
    }
    .br-nav-badge {
      margin-inline-start: auto; font-size: 0.72rem; padding: 1px 6px;
      border-radius: var(--radius-sm); background: var(--bg-elevated);
      color: var(--text-secondary); font-variant-numeric: tabular-nums;
    }
    .br-shell[data-collapsed='true'] .br-nav-item { justify-content: center; padding-inline: 0; }
    .br-shell[data-collapsed='true'] .br-nav-badge { display: none; }

    .br-sidebar-footer {
      padding: 10px; border-block-start: 1px solid var(--border-subtle);
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .br-avatar {
      width: 30px; height: 30px; border-radius: var(--radius-md);
      background: var(--bg-elevated); border: 1px solid var(--border-strong);
      display: grid; place-items: center; font-size: 0.75rem; font-weight: 600;
      color: var(--text-primary); flex-shrink: 0;
    }
    .br-user-meta { min-width: 0; }
    .br-user-name { font-size: var(--text-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .br-user-role { font-size: 0.72rem; color: var(--text-muted); }

    /* Topbar */
    .br-topbar {
      grid-row: 1; grid-column: 2;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding-inline: 18px; background: var(--bg-surface);
      border-block-end: 1px solid var(--border-subtle); min-width: 0;
    }
    .br-shell[data-focus-mode='true'] .br-topbar { grid-column: 1; }
    .br-topbar-start { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .br-breadcrumb {
      display: flex; align-items: center; gap: 6px;
      font-size: var(--text-sm); color: var(--text-muted); white-space: nowrap; overflow: hidden;
    }
    .br-breadcrumb strong { color: var(--text-primary); font-weight: 600; }

    .br-search-trigger {
      flex: 0 1 320px; height: 34px; display: flex; align-items: center; gap: 8px;
      padding-inline: 10px; border-radius: var(--radius-md);
      background: var(--bg-elevated); border: 1px solid var(--border-subtle);
      color: var(--text-muted); font-size: var(--text-sm); cursor: pointer;
      transition: border-color var(--ease), background var(--ease);
    }
    .br-search-trigger:hover { border-color: var(--border-strong); color: var(--text-secondary); }
    .br-kbd {
      margin-inline-start: auto; font-family: var(--font-en-sans); font-size: 0.7rem;
      padding: 1px 5px; border-radius: 4px; background: var(--bg-surface);
      border: 1px solid var(--border-subtle); color: var(--text-muted);
    }

    .br-topbar-end { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* Main Scroll Container (ONLY vertical scroll in app) */
    #app-main {
      grid-row: 2; grid-column: 2;
      min-width: 0; min-height: 0; overflow-y: auto;
      padding: clamp(14px, 1.6vw, 22px); outline: none;
    }
    .br-shell[data-focus-mode='true'] #app-main { grid-column: 1; }
    .br-container {
      max-width: var(--content-max); margin-inline: auto;
      display: flex; flex-direction: column; gap: 18px;
    }

    /* =========================================================================
       3. PRIMITIVES — Buttons, Panels, Tables, Inputs, Status Dots, Tabs
       ========================================================================= */
    .br-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 34px; padding-inline: 12px; border-radius: var(--radius-md);
      border: 1px solid transparent; background: transparent; color: var(--text-primary);
      font-size: var(--text-sm); font-weight: 500; cursor: pointer; white-space: nowrap;
      transition: background var(--ease), border-color var(--ease), color var(--ease);
    }
    .br-btn:focus-visible, .br-input:focus-visible, .br-select:focus-visible, .br-textarea:focus-visible {
      outline: 2px solid var(--focus-ring); outline-offset: 2px;
    }
    .br-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .br-btn-sm { height: 28px; padding-inline: 9px; font-size: var(--text-xs); }
    .br-btn-icon { width: 34px; padding-inline: 0; }
    .br-btn-icon.br-btn-sm { width: 28px; }

    .br-btn-primary {
      background: var(--brand-maroon); color: var(--brand-on-primary);
      box-shadow: var(--shadow-xs);
    }
    .br-btn-primary:hover:not(:disabled) { background: var(--brand-maroon-hover); }

    /* CTA: cream in dark mode, wine in light mode (owner decision 2026-11-21).
       Button-level only — the brand token stays wine, so the nav indicator,
       chart bars, soft tints and dots keep their maroon in dark mode. */
    :root[data-theme='dark'] .br-btn-primary {
      background: #F2E8DC; color: #1A0A0E;
    }
    :root[data-theme='dark'] .br-btn-primary:hover:not(:disabled) {
      background: #FFFFFF;
    }

    .br-btn-secondary {
      background: var(--bg-surface); border-color: var(--border-strong); color: var(--text-primary);
    }
    .br-btn-secondary:hover:not(:disabled) { background: var(--bg-hover); }

    .br-btn-ghost { color: var(--text-secondary); }
    .br-btn-ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-primary); }

    .br-btn-subtle {
      background: var(--bg-elevated); border-color: var(--border-subtle); color: var(--text-primary);
    }
    .br-btn-subtle:hover:not(:disabled) { border-color: var(--border-strong); background: var(--bg-hover); }

    .br-btn-danger-ghost { color: var(--status-danger); }
    .br-btn-danger-ghost:hover:not(:disabled) { background: var(--status-danger-soft); }

    .br-segmented {
      display: inline-flex; padding: 2px; border-radius: var(--radius-md);
      background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    }
    .br-seg-btn {
      height: 26px; padding-inline: 9px; border: 0; border-radius: 4px;
      background: transparent; color: var(--text-secondary);
      font-size: var(--text-xs); font-weight: 500; cursor: pointer;
    }
    .br-seg-btn[aria-pressed='true'] {
      background: var(--bg-surface); color: var(--text-primary);
      box-shadow: var(--shadow-xs); font-weight: 600;
    }

    .br-page-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .br-page-title {
      margin: 0; font-family: var(--font-display);
      font-size: var(--text-xl); font-weight: 700; line-height: 1.25;
    }
    .br-page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* Panels */
    .br-panel {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-xs); overflow: hidden;
    }
    .br-panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 16px; border-block-end: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }
    .br-panel-title {
      margin: 0; font-size: var(--text-sm); font-weight: 600;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .br-count {
      font-size: var(--text-xs); font-weight: 600; color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .br-panel-body { padding: 14px 16px; }

    /* KPI Grid */
    .br-kpi-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
    }
    .br-kpi {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); padding: 13px 16px;
      display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow-xs);
    }
    .br-kpi-label { font-size: var(--text-xs); color: var(--text-muted); font-weight: 500; }
    .br-kpi-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .br-kpi-value {
      font-size: var(--text-kpi); font-weight: 700; line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }
    .br-kpi-meta { font-size: var(--text-xs); color: var(--text-secondary); }
    .br-kpi-meta.danger { color: var(--status-danger); }
    .br-kpi-meta.success { color: var(--status-success); }
    .br-kpi-meta.warning { color: var(--status-warning); }

    /* Grid layouts */
    .br-grid-2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; }
    .br-grid-equal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .br-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

    /* Status Dot */
    .br-status {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: var(--text-xs); color: var(--text-secondary); white-space: nowrap;
    }
    .br-status::before {
      content: ''; width: 6px; height: 6px; border-radius: var(--radius-full);
      background: var(--status-neutral); flex-shrink: 0;
    }
    .br-status[data-tone='success']::before { background: var(--status-success); }
    .br-status[data-tone='warning']::before { background: var(--status-warning); }
    .br-status[data-tone='danger']::before { background: var(--status-danger); }

    /* Progress Bar */
    .br-bar-wrap { display: flex; align-items: center; gap: 8px; min-width: 110px; }
    .br-bar-track {
      flex: 1; height: 6px; border-radius: 3px; background: var(--bg-elevated); overflow: hidden;
    }
    .br-bar-fill { height: 100%; border-radius: 3px; background: var(--status-success); }
    .br-bar-fill[data-tone='warning'] { background: var(--status-warning); }
    .br-bar-fill[data-tone='danger'] { background: var(--status-danger); }

    /* Dense 42px Tables */
    .br-table-wrap { width: 100%; overflow-x: auto; }
    .br-table { width: 100%; border-collapse: collapse; text-align: start; font-size: var(--text-sm); }
    .br-table th {
      height: 36px; padding-inline: 14px; font-size: var(--text-xs); font-weight: 500;
      color: var(--text-muted); border-block-end: 1px solid var(--border-subtle);
      background: var(--bg-inset); white-space: nowrap;
    }
    .br-table td {
      height: var(--row-h); padding: 6px 14px;
      border-block-end: 1px solid var(--border-subtle); vertical-align: middle;
    }
    .br-table tbody tr:last-child td { border-block-end: none; }
    .br-table tbody tr:hover { background: var(--bg-hover); }
    .br-cell-title { font-weight: 500; color: var(--text-primary); }
    .br-cell-sub { font-size: var(--text-xs); color: var(--text-muted); }
    .br-actions-cell { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }

    /* Inputs & Forms */
    .br-input, .br-select, .br-textarea {
      height: 34px; padding-inline: 10px; border-radius: var(--radius-md);
      border: 1px solid var(--border-strong); background: var(--bg-inset);
      color: var(--text-primary); font-size: var(--text-sm); width: 100%;
    }
    .br-textarea { height: auto; padding: 10px; min-height: 84px; resize: vertical; line-height: 1.55; }
    .br-field { display: flex; flex-direction: column; gap: 5px; }
    .br-label { font-size: var(--text-xs); font-weight: 600; color: var(--text-secondary); }
    .br-toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 16px; border-block-end: 1px solid var(--border-subtle);
      background: var(--bg-inset);
    }
    .br-tabs {
      display: flex; align-items: center; gap: 4px;
      border-block-end: 1px solid var(--border-subtle); padding-inline: 16px;
      background: var(--bg-surface);
    }
    .br-tab {
      position: relative; height: 40px; padding-inline: 12px; border: 0;
      background: transparent; color: var(--text-secondary);
      font-size: var(--text-sm); font-weight: 500; cursor: pointer;
    }
    .br-tab[aria-selected='true'] { color: var(--text-primary); font-weight: 600; }
    .br-tab[aria-selected='true']::after {
      content: ''; position: absolute; inset-inline: 0; bottom: -1px;
      height: 2px; background: var(--brand-maroon);
    }

    /* Builder Split Pane */
    .br-builder-sticky {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .br-builder-grid {
      display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start;
    }
    .br-q-list-item {
      width: 100%; padding: 10px 12px; border: 0; border-block-end: 1px solid var(--border-subtle);
      background: transparent; text-align: start; cursor: pointer;
      display: flex; flex-direction: column; gap: 4px;
    }
    .br-q-list-item:hover { background: var(--bg-hover); }
    .br-q-list-item[aria-current='true'] {
      background: var(--brand-maroon-soft);
      border-inline-start: 2.5px solid var(--brand-maroon);
    }
    .br-math-bar {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 6px 8px; background: var(--bg-elevated);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
    }
    .br-math-preview {
      padding: 12px 14px; border-radius: var(--radius-md);
      background: var(--bg-inset); border: 1px dashed var(--border-strong);
      min-height: 48px; line-height: 1.7;
    }

    /* Paper Scan Viewer */
    .br-scan-stage {
      position: relative; height: 290px; overflow: hidden;
      background: #0B090A; border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); display: grid; place-items: center;
    }
    .br-scan-sheet {
      transition: transform 160ms ease; transform-origin: center center;
      width: 88%; max-width: 440px; box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    }

    /* Student Exam View */
    .br-exam-grid {
      display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; align-items: start;
    }
    .br-q-nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .br-q-dot {
      height: 34px; border-radius: var(--radius-md); border: 1px solid var(--border-strong);
      background: var(--bg-inset); font-size: var(--text-xs); font-weight: 600;
      cursor: pointer; position: relative; font-variant-numeric: tabular-nums;
    }
    .br-q-dot.answered { background: var(--status-success-soft); border-color: var(--status-success); color: var(--status-success); }
    .br-q-dot.current { border-color: var(--brand-maroon); box-shadow: inset 0 0 0 1px var(--brand-maroon); }
    .br-q-dot.flagged::after {
      content: ''; position: absolute; top: 3px; inset-inline-end: 3px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--status-warning);
    }
    .br-option-card {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle); background: var(--bg-inset);
      text-align: start; cursor: pointer; transition: border-color var(--ease), background var(--ease);
    }
    .br-option-card:hover { border-color: var(--border-strong); background: var(--bg-hover); }
    .br-option-card.selected {
      border-color: var(--brand-maroon); background: var(--brand-maroon-soft);
    }
    .br-option-card.correct {
      border-color: var(--status-success); background: var(--status-success-soft);
    }
    .br-option-card.wrong {
      border-color: var(--status-danger); background: var(--status-danger-soft);
    }

    /* Drawers & Modals */
    .br-backdrop {
      position: fixed; inset: 0; background: rgba(10, 7, 8, 0.58);
      z-index: 900; display: none; align-items: center; justify-content: center;
      padding: 16px;
    }
    .br-backdrop.open { display: flex; }
    .br-backdrop.drawer-mode { justify-content: flex-end; padding: 0; }
    .br-modal {
      width: 100%; max-width: 560px; max-height: 86dvh; overflow: hidden;
      background: var(--bg-surface); border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay);
      display: flex; flex-direction: column;
    }
    .br-drawer {
      width: min(460px, 100vw); height: 100dvh;
      background: var(--bg-surface); border-inline-start: 1px solid var(--border-strong);
      box-shadow: var(--shadow-overlay); display: flex; flex-direction: column;
    }
    .br-modal-body, .br-drawer-body { padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .br-modal-foot, .br-drawer-foot {
      padding: 12px 16px; border-block-start: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--bg-inset);
    }

    /* Skeleton & Empty States (Zero CLS 42px rows) */
    @keyframes br-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
    .br-skel {
      display: block; height: 14px; border-radius: 4px;
      background: var(--bg-elevated); animation: br-pulse 1.3s ease-in-out infinite;
    }
    .br-empty {
      padding: 40px 20px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .br-empty-icon {
      width: 40px; height: 40px; border-radius: var(--radius-lg);
      background: var(--bg-elevated); border: 1px solid var(--border-subtle);
      display: grid; place-items: center; color: var(--text-muted);
    }

    /* Toast */
    .br-toast {
      position: fixed; bottom: 18px; inset-inline-end: 18px; z-index: 1500;
      padding: 10px 14px; border-radius: var(--radius-md);
      background: var(--bg-surface); border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-overlay); font-size: var(--text-sm);
      display: none; align-items: center; gap: 8px;
    }
    .br-toast.show { display: flex; }

    /* Unread Notification Dot */
    .br-dot-badge {
      position: absolute; top: 6px; inset-inline-end: 6px;
      width: 7px; height: 7px; border-radius: 50%; background: var(--brand-maroon);
    }

    /* Mobile Drawer + 375px Responsive Stacked Tables */
    .br-mobile-menu-btn { display: none; }
    @media (max-width: 960px) {
      .br-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .br-grid-2, .br-grid-equal, .br-grid-3, .br-builder-grid, .br-exam-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    @media (max-width: 768px) {
      .br-shell, .br-shell[data-collapsed='true'] { grid-template-columns: minmax(0, 1fr); }
      .br-topbar { grid-column: 1; padding-inline: 12px; }
      #app-main { grid-column: 1; padding: 12px; }
      .br-mobile-menu-btn { display: inline-flex; }
      .br-search-trigger { flex: 0 0 34px; width: 34px; justify-content: center; padding-inline: 0; }
      .br-search-trigger span, .br-search-trigger .br-kbd { display: none; }
      .br-sidebar {
        position: fixed; inset-block: 0; inset-inline-start: 0; width: 256px;
        transform: translateX(110%); transition: transform 180ms ease;
        box-shadow: var(--shadow-overlay);
      }
      :root[dir='ltr'] .br-sidebar { transform: translateX(-110%); }
      .br-sidebar.mobile-open { transform: translateX(0); }

      /* Stacked 375px tables */
      .br-table thead { display: none; }
      .br-table, .br-table tbody, .br-table tr, .br-table td { display: block; width: 100%; }
      .br-table tr {
        padding: 10px 12px; border-block-end: 1px solid var(--border-subtle);
      }
      .br-table td {
        height: auto; padding: 4px 0; border: 0;
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
      }
      .br-table td::before {
        content: attr(data-label); font-size: var(--text-xs); color: var(--text-muted); font-weight: 500;
      }
      .br-table td.br-td-primary { display: block; padding-bottom: 6px; }
      .br-table td.br-td-primary::before { display: none; }
    }
  </style>
</head>

      const test = state.tests.find(t => t.id === state.gradingTestId) || state.tests[1];

      const activeSub = subs.find(s => s.id === state.gradingSubId) || subs[0];
      const activeStudent = activeSub ? state.students.find(s => s.id === activeSub.studentId) : null;
      const essayQ = test.questions.find(q => q.type === 'essay') || test.questions[test.questions.length - 1];
      const analysis = state.itemAnalysis[test.id] || [];

      return `
        <div class="br-page-head">

        <div class="br-panel">

          ${state.gradingTab === 'analysis' ? `
            <div class="br-panel-body" style="display:flex;flex-direction:column;gap:14px">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--status-danger-soft);border:1px solid var(--border-subtle);border-radius:var(--radius-md)">

              <div class="br-panel-head">
                <span class="br-panel-title">سؤال ${idx+1} · ${q.type==='mcq'?'اختيار من متعدد':'مقالي + ورقة حل'}</span>
                <span class="br-status" data-tone="${idx===3?'warning':isCorrect?'success':'danger'}">${idx===3?`${sub.essayScore}/${sub.essayMax} درجة جزئية`:isCorrect?`${q.points}/${q.points} صحيح`:`0/${q.points} خطأ`}</span>
              </div>
              <div class="br-panel-body" style="display:flex;flex-direction:column;gap:10px">
                <div>${renderMathText(q.prompt)}</div>
                ${q.type==='mcq' ? `
                  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px">
                    ${q.options.map((opt, oi) => `
                      <div class="br-option-card ${oi===q.answerIdx?'correct':(!isCorrect && oi===1?'wrong':'')}" style="cursor:default">
                        <span>${renderMathText(opt)}</span>
                      </div>`).join('')}

                ` : `<div class="br-scan-stage" style="height:230px">${renderPaperScanSvg()}</div>`}
                <div class="br-math-preview" style="font-size:var(--text-sm)"><strong>الشرح النموذجي:</strong> ${renderMathText(q.modelAnswer)}</div>
              </div>
            </article>`;
        }).join('')}`;
    }

    function renderCmdResults(query) {
      const q = query.trim().toLowerCase();
      const items = [
        ...state.tests.map(t => ({ group: 'الاختبارات', label: t.title, sub: cohortName(t.cohortId), run: () => { openBuilder(t.id); closeOverlay(); } })),
        ...state.students.slice(0, 12).map(s => ({ group: 'الطلاب', label: studentName(s), sub: `${cohortName(s.cohortId)} · إتقان ${s.mastery}%`, run: () => { closeOverlay(); openStudentDrawer(s.id); } })),
        { group: 'التنقل السريع', label: 'تحليل البنود ونسب الخطأ', sub: 'التصحيح والتحليل', run: () => { state.gradingTab='analysis'; navigate('grading'); closeOverlay(); } },
        { group: 'التنقل السريع', label: 'معاينة الاختبار كطالب', sub: 'الوضع الخالي من التشتيت', run: () => { closeOverlay(); startStudentExam('t_pub_1'); } }
      ].filter(x => !q || x.label.toLowerCase().includes(q) || x.sub.toLowerCase().includes(q));

      document.getElementById('cmd-results').innerHTML = items.length ? items.slice(0, 10).map((it, i) => `

    /* =========================================================================
       12. ACTIONS & STATE MUTATIONS
       ========================================================================= */
    let autosaveTimer = null;
    function markAutoSave() {
      state.builderSaveState = 'saving';
      const ind = document.getElementById('save-indicator');
      if (ind) ind.textContent = 'جارٍ الحفظ...';
      clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(() => {
        state.builderSaveState = 'saved';
        const ind2 = document.getElementById('save-indicator');
        if (ind2) ind2.textContent = 'تم الحفظ تلقائيًا';
      }, 450);
    }

    function createNewDraft() {
      const id = 't_' + Date.now();
      state.tests.unshift({
        id, title: 'اختبار جديد — مسودة', cohortId: state.classFilter==='all'?'c_a':state.classFilter,
        status: 'draft', updatedAr: 'الآن',
        settings: { duration: 25, attempts: 1, shuffleQ: true, shuffleOpt: true, release: 'manual', startWindow: '2026-11-23T09:00', endWindow: '2026-11-26T22:00' },
        questions: [{ id: 'q_' + Date.now(), type: 'mcq', points: 2, prompt: 'أوجد قيمة $\\int_{0}^{1} 2x\\,dx$', options: ['$1$', '$2$', '$0$', '$4$'], answerIdx: 0, modelAnswer: '$[x^2]_0^1 = 1$' }]
      });
      openBuilder(id);
      showToast('تم إنشاء مسودة اختبار جديدة');
    }

    function createRemedialDraft(sourceTestId) {
      const src = state.tests.find(t => t.id === sourceTestId);
      const weakIds = (state.itemAnalysis[sourceTestId] || []).filter(x => x.accuracy < 60).map(x => x.qId);
      const weakQs = src.questions.filter(q => weakIds.includes(q.id)).map(q => ({ ...q, id: 'rem_' + q.id + '_' + Date.now() }));
      const id = 't_rem_' + Date.now();
      state.tests.unshift({
        id, title: `اختبار علاجي — ${src.title}`, cohortId: src.cohortId, status: 'draft', updatedAr: 'الآن',
        settings: { ...src.settings }, questions: weakQs.length ? weakQs : [src.questions[0]]
      });
      openBuilder(id);
      showToast(`تم توليد اختبار علاجي من ${weakQs.length} أسئلة منخفضة الإتقان`);
    }

    function openBuilder(testId) {
      state.role = 'teacher';
      state.builderTestId = testId;
      state.builderTab = 'questions';
      state.builderSelectedQ = 0;
      navigate('builder');
    }

    function publishTest(testId) {
      const t = state.tests.find(x => x.id === testId);
      if (t) { t.status = 'published'; t.updatedAr = 'الآن'; showToast(`تم نشر «${t.title}»`); render(); }
    }

    function updateTestField(testId, key, val) {
      const t = state.tests.find(x => x.id === testId);
      if (t) { t[key] = val; markAutoSave(); }
    }

    function updateTestSetting(testId, key, val) {
      const t = state.tests.find(x => x.id === testId);
      if (t) { t.settings[key] = val; markAutoSave(); }
    }

    function addBlankQuestion(testId) {
      const t = state.tests.find(x => x.id === testId);
      t.questions.push({ id: 'q_' + Date.now(), type: 'mcq', points: 2, prompt: 'اكتب نص السؤال مع معادلة مثل $x^2 + 1$', options: ['$1$', '$2$', '$3$', '$4$'], answerIdx: 0, modelAnswer: '' });
      state.builderSelectedQ = t.questions.length - 1;
      markAutoSave(); render();
    }

    function updateQuestionField(field, val, liveOnly = false) {
      const t = state.tests.find(x => x.id === state.builderTestId);
      const q = t.questions[state.builderSelectedQ];
      q[field] = val;
      markAutoSave();
      if (liveOnly) {
        if (field === 'prompt') {
          const prev = document.getElementById('q-live-preview');
          if (prev) prev.innerHTML = renderMathText(val);
        }
      } else {
        render();
      }
    }

    function updateQuestionOption(optIdx, val) {
      const t = state.tests.find(x => x.id === state.builderTestId);
      t.questions[state.builderSelectedQ].options[optIdx] = val;
      markAutoSave();
    }

    function insertMathSnippet(snippet) {
      const ta = document.getElementById('q-prompt-input');
      if (!ta) return;
      const start = ta.selectionStart, end = ta.selectionEnd;
      const next = ta.value.slice(0, start) + ' ' + snippet + ' ' + ta.value.slice(end);
      ta.value = next;
      updateQuestionField('prompt', next, true);
      ta.focus();
    }

    function deleteCurrentQuestion() {
      const t = state.tests.find(x => x.id === state.builderTestId);
      if (t.questions.length <= 1) return showToast('يجب أن يحتوي الاختبار على سؤال واحد على الأقل');
      t.questions.splice(state.builderSelectedQ, 1);
      state.builderSelectedQ = Math.max(0, state.builderSelectedQ - 1);
      markAutoSave(); render();
    }

    function insertBankQuestionToActiveTest(bankId, keepDrawer = false) {
      const bq = state.questionBank.find(x => x.id === bankId);
      const t = state.tests.find(x => x.id === state.builderTestId) || state.tests[0];
      t.questions.push({ ...JSON.parse(JSON.stringify(bq)), id: 'q_' + Date.now(), bankId: bq.id });
      state.builderSelectedQ = t.questions.length - 1;
      markAutoSave();
      showToast('تم إدراج السؤال في الاختبار');
      render();
      if (keepDrawer) openBankPickerDrawer();
    }

    function adjustScan(dZoom, dRot) {
      state.scanZoom = Math.min(2.2, Math.max(0.7, +(state.scanZoom + dZoom).toFixed(2)));
      state.scanRotate = (state.scanRotate + dRot) % 360;
      render();
    }

    function stepEssayScore(subId, delta) {
      const sub = state.submissions.find(x => x.id === subId);
      sub.essayScore = Math.min(sub.essayMax, Math.max(0, +(sub.essayScore + delta).toFixed(1)));
      render();
    }

    function updateSubNote(subId, val) {
      const sub = state.submissions.find(x => x.id === subId);
      if (sub) sub.teacherNote = val;
    }

    function approveGrade(subId) {
      const sub = state.submissions.find(x => x.id === subId);
      if (sub) { sub.status = 'graded'; showToast('تم اعتماد الدرجة وإرسال إشعار للطالب'); render(); }
    }

    function sendStudentNote(studentId) {
      const input = document.getElementById('student-note-input');
      const val = input.value.trim();
      if (!val) return;
      state.students.find(s => s.id === studentId).notes.unshift(val);
      showToast('تم إرسال رسالة المتابعة');
      closeOverlay();
    }

    function saveNewBankQuestion() {
      const prompt = document.getElementById('nb-prompt').value.trim();
      if (!prompt) return;
      state.questionBank.unshift({
        id: 'qb_' + Date.now(), unitId: document.getElementById('nb-unit').value,
        type: 'essay', diff: 'medium', points: Number(document.getElementById('nb-pts').value) || 2,
        prompt, options: [], answerIdx: -1, modelAnswer: document.getElementById('nb-model').value.trim()
      });
      closeOverlay(); showToast('تمت إضافة السؤال لبنك الأسئلة'); render();
    }

    function saveMaterial() {
      const title = document.getElementById('mat-title').value.trim();
      if (!title) return;
      state.materials.unshift({ id: 'm_' + Date.now(), title, cohortId: document.getElementById('mat-cohort').value, type: 'PDF', size: '1.8 MB', updated: 'الآن' });
      closeOverlay(); showToast('تم رفع المادة التعليمية'); render();
    }

    function startStudentExam(testId) {
      state.role = 'student';
      state.studentExamId = testId;
      state.examIdx = 0;
      state.examSecondsLeft = (state.tests.find(t => t.id === testId)?.settings.duration || 25) * 60;
      navigate('s_exam');
      state.examTimerId = setInterval(() => {
        state.examSecondsLeft = Math.max(0, state.examSecondsLeft - 1);
        const clk = document.getElementById('exam-clock');
        if (clk) {
          const m = String(Math.floor(state.examSecondsLeft / 60)).padStart(2, '0');
          const s = String(state.examSecondsLeft % 60).padStart(2, '0');
          clk.innerHTML = `${icon('clock', 14)} ${m}:${s}`;
        }
      }, 1000);
    }

    function exitStudentExam() {
      if (state.examTimerId) { clearInterval(state.examTimerId); state.examTimerId = null; }
      navigate('s_dashboard');
    }

    function toggleExamFlag(qId) {
      state.examFlags[qId] = !state.examFlags[qId];
      render();
    }

    /* =========================================================================
       13. SHELL CHROME & MASTER RENDER
       ========================================================================= */
    function renderChrome() {
      const dict = T[state.lang];
      const shell = document.getElementById('app-shell');
      shell.dataset.collapsed = String(state.collapsed);
      shell.dataset.focusMode = String(state.route === 's_exam');

      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.dataset.theme = state.theme;

      document.getElementById('skip-link').textContent = dict.skip;
      document.getElementById('search-placeholder').textContent = dict.searchPlaceholder;
      document.getElementById('search-icon-slot').innerHTML = icon('search', 15);
      document.getElementById('btn-collapse').innerHTML = icon('panelLeft', 16);
      document.getElementById('btn-mobile-menu').innerHTML = icon('menu', 18);
      document.getElementById('btn-theme').innerHTML = icon(state.theme === 'dark' ? 'sun' : 'moon', 16);
      document.getElementById('btn-lang').textContent = state.lang === 'ar' ? 'EN' : 'عربي';

      const unreadCount = state.notifications.filter(n => n.unread).length;
      document.getElementById('btn-notifications').innerHTML = icon('bell', 16) + (unreadCount ? '<span class="br-dot-badge"></span>' : '');

      document.querySelectorAll('#role-switcher .br-seg-btn').forEach(b => {
        b.setAttribute('aria-pressed', String(b.dataset.role === state.role));
        b.textContent = b.dataset.role === 'teacher' ? dict.teacherRole : dict.studentRole;
      });
      document.querySelectorAll('#state-switcher .br-seg-btn').forEach(b => {
        b.setAttribute('aria-pressed', String(b.dataset.uistate === state.uiState));
      });

      const pendingCount = state.submissions.filter(s => s.status === 'pending').length;
      const navEl = document.getElementById('sidebar-nav');
      if (state.role === 'teacher') {
        const g1 = [
          { id: 'dashboard', ic: 'home' },
          { id: 'classes', ic: 'classes', badge: COHORTS.length },
          { id: 'tests', ic: 'tests', badge: state.tests.length },
          { id: 'builder', ic: 'sliders' },
          { id: 'grading', ic: 'grading', badge: pendingCount || null }
        ];
        const g2 = [
          { id: 'bank', ic: 'bank', badge: state.questionBank.length },
          { id: 'materials', ic: 'materials' },
          { id: 'students', ic: 'students', badge: state.students.length }
        ];
        navEl.innerHTML = `
          <div><div class="br-nav-group-label">${dict.navGroups.teaching}</div><ul class="br-nav-list">${g1.map(navItemHtml).join('')}</ul></div>
          <div><div class="br-nav-group-label">${dict.navGroups.content}</div><ul class="br-nav-list">${g2.map(navItemHtml).join('')}</ul></div>`;
      } else {
        const gs = [
          { id: 's_dashboard', ic: 'home' },
          { id: 's_exam', ic: 'tests' },
          { id: 's_review', ic: 'grading' }
        ];
        navEl.innerHTML = `<div><div class="br-nav-group-label">${dict.navGroups.student}</div><ul class="br-nav-list">${gs.map(navItemHtml).join('')}</ul></div>`;
      }

      document.getElementById('sidebar-footer').innerHTML = `
        <div class="br-avatar">${state.role==='teacher'?'م ع':'ع خ'}</div>
        <div class="br-user-meta">
          <div class="br-user-name">${state.role==='teacher'?dict.teacherName:dict.studentName}</div>
          <div class="br-user-role">${state.role==='teacher'?dict.teacherSub:dict.studentSub}</div>
        </div>`;

      document.getElementById('breadcrumb').innerHTML = `
        <span>BRIDGIO</span><span>/</span><strong>${dict.routes[state.route] || ''}</strong>`;
    }

    function navItemHtml(item) {
      const label = T[state.lang].routes[item.id];
      return `<li><button class="br-nav-item" aria-current="${state.route===item.id?'page':'false'}" title="${label}" onclick="${item.id==='s_exam'?"startStudentExam('t_pub_1')":`navigate('${item.id}')`}">
        ${icon(item.ic, 16)}
        <span class="br-sidebar-text">${label}</span>
        ${item.badge ? `<span class="br-nav-badge">${item.badge}</span>` : ''}
      </button></li>`;
    }

    function render() {
      renderChrome();
      const map = {
        dashboard: renderTeacherDashboard,
        classes: renderClassesView,
        tests: renderTestsView,
        builder: renderExamBuilder,
        grading: renderGradingView,
        bank: renderBankView,
        materials: renderMaterialsView,
        students: renderStudentsView,
        s_dashboard: renderStudentDashboard,
        s_exam: renderStudentActiveExam,
        s_review: renderStudentPostExamReview
      };
      document.getElementById('main-container').innerHTML = (map[state.route] || renderTeacherDashboard)();
    }

    /* =========================================================================
       14. GLOBAL EVENT BINDINGS
       ========================================================================= */
    document.getElementById('btn-collapse').addEventListener('click', () => { state.collapsed = !state.collapsed; renderChrome(); });
    document.getElementById('btn-mobile-menu').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('mobile-open'); });
    document.getElementById('btn-theme').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; renderChrome(); });
    document.getElementById('btn-lang').addEventListener('click', () => { state.lang = state.lang === 'ar' ? 'en' : 'ar'; render(); });
    document.getElementById('btn-open-search').addEventListener('click', openCommandPalette);
    document.getElementById('btn-notifications').addEventListener('click', openNotificationsDrawer);

    document.querySelectorAll('#role-switcher .br-seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.role = btn.dataset.role;
        navigate(state.role === 'teacher' ? 'dashboard' : 's_dashboard');
      });
    });

    document.querySelectorAll('#state-switcher .br-seg-btn').forEach(btn => {
      btn.addEventListener('click', () => { state.uiState = btn.dataset.uistate; render(); });
    });

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openCommandPalette();
      } else if (e.key === 'Escape') {
        closeOverlay();
        document.getElementById('sidebar').classList.remove('mobile-open');
      }
    });

    window.addEventListener('load', render);
    render();
  </script>
</body>
</html>
